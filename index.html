<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dein Wasserverbrauch</title>
    <style>
        /* --- GRUNDLAYOUT --- */
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            color: #fff;
            overflow: hidden; /* Verhindert Scrollen der ganzen Seite */
        }

        /* --- APP WRAPPER (SIDEBAR + MAIN) --- */
        #app-wrapper {
            display: flex;
            width: 100%;
            height: 100%;
        }

        /* --- SIDEBAR (Links) --- */
        #sidebar {
            width: 250px;
            background-color: #111;
            border-right: 1px solid #333;
            padding: 20px;
            box-sizing: border-box;
            display: flex;
            flex-direction: column;
            z-index: 20;
        }

        #sidebar h2 {
            color: #81d4fa;
            font-size: 1.3em;
            margin-bottom: 20px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .stats-list {
            list-style: none;
            padding: 0;
            margin: 0;
            font-size: 1.1em;
        }

        .stats-list li {
            background: rgba(255, 255, 255, 0.05);
            margin-bottom: 10px;
            padding: 12px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #stat-optimiert-container {
            border: 1px solid #69f0ae;
            background: rgba(105, 240, 174, 0.1);
        }

        /* --- HAUPTBEREICH --- */
        #main-area {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
            position: relative;
        }

        /* --- SPIEL-CONTAINER (16:9 Format) --- */
        #game-container {
            position: relative;
            width: 100%;
            max-width: 177.78vh; /* Erzwingt max Breite basierend auf Höhe für 16:9 */
            aspect-ratio: 16 / 9; 
            background-color: #050505;
            background-size: contain; 
            background-position: center;
            background-repeat: no-repeat;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        /* =========================================================
           DER TEXT-RAHMEN (FA01 ANPASSUNG) 
        ========================================================= */
        .text-frame {
            position: absolute;
            top: 14%;    
            bottom: 20%; 
            left: 15%;   
            right: 15%;  
            
            /* Internes Layout */
            padding: 20px;
            overflow-y: auto; 
            text-align: left;
            font-size: 1.3vw; 
            line-height: 1.5;
            
            background: rgba(0, 0, 0, 0.4); 
            border-radius: 10px;
            transition: opacity 0.4s ease;
        }

        /* Anpassung für mobile Geräte */
        @media (max-width: 850px) {
            #app-wrapper { flex-direction: column; }
            #sidebar { 
                width: 100%; 
                padding: 10px; 
                border-right: none; 
                border-bottom: 1px solid #333; 
            }
            #sidebar h2 { display: none; }
            .stats-list {
                display: flex;
                flex-wrap: wrap;
                justify-content: space-between;
                font-size: 0.9em;
            }
            .stats-list li {
                flex: 1 1 45%; 
                margin: 3px;
                padding: 8px;
            }
            #game-container { aspect-ratio: auto; height: 100%; }
            .text-frame { top: 5%; bottom: 5%; left: 5%; right: 5%; font-size: 3.5vw; }
        }

        /* --- TYPOGRAFIE & ELEMENTE --- */
        h2 { margin-top: 0; color: #4fc3f7; font-size: 1.5em; }
        h3 { margin-top: 0; color: #81d4fa; }
        p { margin-bottom: 15px; }
        
        .highlight-green { color: #69f0ae; font-weight: bold; }
        .highlight-orange { color: #ffd54f; font-weight: bold; }
        .highlight-red { color: #ff5252; font-weight: bold; }

        /* --- BUTTONS --- */
        .option-btn {
            display: block;
            width: 100%;
            background-color: rgba(13, 71, 161, 0.7);
            color: #fff;
            border: 1px solid #1976d2;
            padding: 12px 15px;
            margin-bottom: 10px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            text-align: left;
            transition: background-color 0.2s, transform 0.1s;
        }
        .option-btn:hover {
            background-color: rgba(25, 118, 210, 0.9);
            transform: scale(1.01);
        }

        .action-btn {
            display: inline-block;
            background-color: #00b4ff;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            margin-top: 15px;
            text-decoration: none;
            text-transform: uppercase;
            transition: background-color 0.2s;
        }
        .action-btn:hover { background-color: #69f0ae; }
        
        .action-btn-gold { background-color: #ffd54f; }
        .action-btn-gold:hover { background-color: #ffca28; }

        /* --- SKIP BUTTON (Unten zentriert) --- */
        .skip-container {
            position: absolute;
            bottom: 5%;
            width: 100%;
            text-align: center;
        }
        .skip-btn {
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 25px;
            border-radius: 50px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-weight: bold;
            transition: all 0.2s;
        }
        .skip-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .fullscreen-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            cursor: pointer;
            z-index: 10;
        }
        .center-msg {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            width: 80%;
        }

        /* Scrollbar für den Rahmen */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #00b4ff; border-radius: 4px; }

        .opt-liste {
            margin: 15px 0;
            padding-left: 20px;
            font-size: 0.9em;
            color: #ddd;
        }
        .opt-liste li { margin-bottom: 8px; }

        /* --- KIOSK: Touch-Bedienung --- */
        body, html {
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }
        img { -webkit-user-drag: none; }
        /* Auf Touchscreens keine "klebenden" Hover-Effekte */
        @media (hover: none) {
            .option-btn:hover { background-color: rgba(13, 71, 161, 0.7); transform: none; }
            .action-btn:hover { background-color: #00b4ff; }
            .action-btn-gold:hover { background-color: #ffd54f; }
            .skip-btn:hover { background: rgba(0, 0, 0, 0.6); }
        }
        /* KIOSK: Zurück-zum-Kiosk-Button (unten in der Seitenleiste) */
        #kiosk-back-btn {
            display: none;
            margin-top: auto;
            width: 100%;
            padding: 14px 12px;
            background: rgba(255, 255, 255, 0.06);
            color: #fff;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 8px;
            font-size: 1em;
            font-weight: bold;
            cursor: pointer;
            font-family: inherit;
        }
        #kiosk-back-btn.visible { display: block; }
        @media (max-width: 850px) {
            #kiosk-back-btn { margin-top: 6px; padding: 8px; }
        }
        .option-btn:active, .action-btn:active, #kiosk-back-btn:active, .skip-btn:active { transform: scale(0.98); }
        /* --- WEB: Zusatz-Buttons --- */
        #web-btns { display: none; margin-top: auto; flex-direction: column; gap: 8px; }
        #web-btns.visible { display: flex; }
        .web-btn {
            display: none; padding: 10px 12px; text-align: center; text-decoration: none;
            background: rgba(255,255,255,0.06); color: #fff; font: bold 0.9em inherit;
            font-family: inherit; border: 1px solid rgba(255,255,255,0.3); border-radius: 8px; cursor: pointer;
        }
        .web-btn.visible { display: block; }
        @media (max-width: 850px) {
            #web-btns { margin-top: 6px; flex-direction: row; }
            .web-btn { flex: 1; padding: 6px; }
        }
    </style>

</head>

/* =========================================================
   SPIEL-LOGIK & ZUSTAND
========================================================= */
const state = {
    gesamt: 0,
    direkt: 0,
    indirekt: 0,
    eingespart: 0,
    entscheidungen: {}, // Speichert { frageId: { optionId, potential } }
    optList: [],        // Liste der zu optimierenden Fragen
    optIndex: 0,
    optimierungen: [],  // Speichert die getätigten Optimierungen
    currentAudio: null
};

/* =========================================================
   KIOSK-EINSTELLUNGEN
========================================================= */
const KIOSK = {
    // Läuft das Spiel im Museums-Kiosk (Electron-Launcher)?
    aktiv: !!window.kioskAPI,
    // PDF-Speichern im Kiosk anbieten? (Besucher können die Datei dort nicht mitnehmen)
    pdfImKiosk: false,
    // Nach so vielen Sekunden ohne Berührung zurück zum Titelbild (0 = aus)
    leerlaufSekunden: window.kioskAPI ? 180 : 0
};

// KIOSK: Spielstand vollständig zurücksetzen (neuer Besucher)
function resetState() {
    state.gesamt = 0;
    state.direkt = 0;
    state.indirekt = 0;
    state.eingespart = 0;
    state.entscheidungen = {};
    state.optList = [];
    state.optIndex = 0;
    state.optimierungen = [];
}

// KIOSK: Leerlauf-Timer. Läuft nicht, solange ein Audio abgespielt wird
// und nicht auf dem Titelbild.
let idleTimer = null;
let currentScene = null;
function resetIdleTimer() {
    clearTimeout(idleTimer);
    if (!KIOSK.leerlaufSekunden || currentScene === 'Start') return;
    idleTimer = setTimeout(() => {
        if (state.currentAudio && !state.currentAudio.paused && !state.currentAudio.ended) {
            resetIdleTimer(); // Erzählung läuft noch – weiter warten
            return;
        }
        goTo('Start');
    }, KIOSK.leerlaufSekunden * 1000);
}
['pointerdown', 'keydown'].forEach(ev =>
    document.addEventListener(ev, resetIdleTimer, { passive: true }));
document.addEventListener('contextmenu', e => e.preventDefault());

// KIOSK: Spiel verlassen und zur Spielauswahl zurückkehren
function zurueckZumKiosk() {
    clearTimeout(idleTimer);
    if (state.currentAudio) { state.currentAudio.pause(); state.currentAudio = null; }
    const api = window.kioskAPI || {};
    // Falls der Launcher eine eigene Funktion dafür anbietet, diese nutzen
    for (const name of ['backToLauncher', 'goHome', 'showLauncher', 'loadLauncher', 'home']) {
        if (typeof api[name] === 'function') { api[name](); return; }
    }
    // Sonst direkt zur Launcher-Seite (games/<ordner>/game.html → launcher.html)
    window.location.href = '../../launcher.html';
}

// UI Referenzen
const container = document.getElementById('game-container');
const uiLayer = document.getElementById('ui-layer');

/* Deutsche Zahlenformatierung (Punkt als Tausendertrenner, Komma als Dezimaltrenner) */
function formatNumber(num) {
    return num.toLocaleString('de-DE', { minimumFractionDigits: 0, maximumFractionDigits: 2 });
}

// Statistik aktualisieren (Sidebar links)
function updateStats() {
    document.getElementById('stat-gesamt').innerText = formatNumber(state.gesamt) + " L";
    document.getElementById('stat-direkt').innerText = formatNumber(state.direkt) + " L";
    document.getElementById('stat-indirekt').innerText = formatNumber(state.indirekt) + " L";

    const optContainer = document.getElementById('stat-optimiert-container');
    if (state.eingespart > 0) {
        optContainer.style.display = 'flex';
        document.getElementById('stat-eingespart').innerText = "-" + formatNumber(state.eingespart) + " L";
    } else {
        optContainer.style.display = 'none';
    }
}

// Audio abspielen
function playAudio(src, onEndedCallback) {
    if(state.currentAudio) {
        state.currentAudio.pause();
        state.currentAudio = null;
    }
    try {
        const audio = new Audio(src);
        state.currentAudio = audio;
        audio.play().catch(e => console.log("Audio play error/not found:", e));
        audio.onended = () => {
            // KIOSK: nur weiterschalten, wenn dieses Audio noch aktuell ist
            if (state.currentAudio !== audio) return;
            resetIdleTimer();
            if(onEndedCallback) onEndedCallback();
        };
        // KIOSK: fehlt die Datei, nicht hängen bleiben, sondern nach kurzer Pause weiter
        audio.onerror = () => {
            console.log("Audio fehlt/defekt:", src);
            setTimeout(() => {
                if (state.currentAudio === audio && onEndedCallback) onEndedCallback();
            }, 1500);
        };
    } catch(e) {
        console.log("Audio init error:", e);
    }
}

// Hintergrundbild setzen
function setBackground(imgSrc) {
    // KIOSK: leerer Wert = schwarz (url('') würde die Seite selbst nachladen)
    container.style.backgroundImage = imgSrc ? `url('${imgSrc}')` : 'none';
}

// Hilfsfunktion Min/Max Verbrauch einer Frage
function getMinMax(fId) {
    const vals = Object.values(DB.fragen[fId].optionen).map(o => o.verbrauch);
    return { min: Math.min(...vals), max: Math.max(...vals) };
}

// Farbe basierend auf Verbrauch
function getColor(val, min, max) {
    if(val === min) return "highlight-green";
    if(val === max) return "highlight-red";
    return "highlight-orange";
}

        }
    });

    // Datei speichern
    doc.save("Meine_Wasser_Bilanz.pdf");
}

/* =========================================================
   SCENE ROUTER
========================================================= */
function goTo(sceneId, params = {}) {
    uiLayer.innerHTML = ""; // Clear UI
    currentScene = sceneId;
    resetIdleTimer();
    
    if(state.currentAudio) {
        state.currentAudio.pause();
        state.currentAudio = null;
    }

    switch(sceneId) {
        case 'Start':
            resetState(); // KIOSK: jeder Start beginnt bei null
            setBackground('images/Titel.png');
            uiLayer.innerHTML = `<div class="fullscreen-overlay" onclick="goTo('S00')"></div>`;
            updateStats();
            break;

        case 'S00':
            setBackground('images/Bild0.png');
            uiLayer.innerHTML = `<div class="skip-container"><button class="skip-btn" onclick="goTo('S01_1')">Überspringen</button></div>`;
            playAudio('audio/S00.mp3', () => goTo('S01_1'));
            break;

        case 'S01_1':
            setBackground(''); // Schwarz
            uiLayer.innerHTML = `
                <div class="center-msg"><h2 style="font-family: sans-serif;">Bitte schließe deine Augen und lausche meiner Stimme...</h2></div>
                <div class="skip-container"><button class="skip-btn" onclick="goTo('S01_2')">Überspringen</button></div>`;
            playAudio('audio/S01_1.mp3', () => goTo('S01_2'));
            break;

        case 'S01_2':
            setBackground('images/Bild1.png');
            uiLayer.innerHTML = `<div class="skip-container"><button class="skip-btn" onclick="goTo('Question', {id: 'F01'})">Überspringen</button></div>`;
            playAudio('audio/S01_2E.mp3', () => goTo('Question', {id: 'F01'}));
            break;

        case 'Question':
            const q = DB.fragen[params.id];
            setBackground(`images/FA${params.id.replace('F','')}.png`);
            
            let optionsHtml = '';
            for(let key in q.optionen) {
                optionsHtml += `<button class="option-btn" onclick="saveAnswer('${q.id}', '${key}')">${q.optionen[key].text}</button>`;
            }

            uiLayer.innerHTML = `
                <div class="text-frame">
                    <h2>${q.frage}</h2>
                    <br>
                    ${optionsHtml}
                </div>
            `;
            break;

        case 'Answer':
            const fId = params.id;
            const oId = state.entscheidungen[fId].optionId;
            const frage = DB.fragen[fId];
            const option = frage.optionen[oId];
            const limits = getMinMax(fId);
            
            setBackground(`images/FA${fId.replace('F','')}.png`);

            let verbrauchText = `${formatNumber(option.verbrauch)} Liter Wasser.`;
            if(fId === 'F06' || fId === 'F07') {
                verbrauchText = `${formatNumber(option.verbrauch * 365)} Liter Wasser pro Jahr (${formatNumber(option.verbrauch)} L/Tag).`;
            }

            let nextAction = '';
            if(fId === 'F01') nextAction = `goTo('Question', {id: 'F02'})`;
            else if(fId === 'F02') nextAction = `goTo('AudioExpl', {id: 'E02', next: 'E02_B'})`;
            else if(fId === 'F03') nextAction = `goTo('AudioExpl', {id: 'E03', next: 'F04'})`; 
            else if(fId === 'F04') nextAction = `goTo('Question', {id: 'F05'})`;
            else if(fId === 'F05') nextAction = `goTo('Question', {id: 'F06'})`;
            else if(fId === 'F06') nextAction = `goTo('Question', {id: 'F07'})`;
            else if(fId === 'F07') nextAction = `goTo('Question', {id: 'F08'})`;
            else if(fId === 'F08') nextAction = `goTo('ZWA')`;

            let btnText = (fId === 'F03') ? "WARUM ?" : "Weiter";

            uiLayer.innerHTML = `
                <div class="text-frame">
                    <p><b>Entscheidung:</b> ${option.text}</p>
                    <p>Das verbraucht <span class="${getColor(option.verbrauch, limits.min, limits.max)}">${verbrauchText}</span></p>
                    <p><i>${option.erklaerung}</i></p>
                    <button class="action-btn" onclick="${nextAction}">${btnText}</button>
                </div>
            `;
            break;

        case 'AudioExpl':
            setBackground(`images/${params.id}.png`);
            uiLayer.innerHTML = `<div class="skip-container"><button class="skip-btn" onclick="handleAudioNext('${params.id}', '${params.next}')">Überspringen</button></div>`;
            playAudio(`audio/${params.id}.mp3`, () => handleAudioNext(params.id, params.next));
            break;

        case 'ZWA':
            setBackground('images/END.png');
            let anteil = (state.gesamt > 0) ? ((state.direkt / state.gesamt) * 100) : 0;
            let reflexion = "";
            if (state.gesamt < 20) reflexion = "Sehr guter Start! Dein Wasserverbrauch ist bisher niedrig.";
            else if (state.gesamt < 100) reflexion = "Du liegst im mittleren Bereich – hier gibt es noch Einsparpotenzial.";
            else reflexion = "Dein aktueller Verbrauch ist hoch – kleine Änderungen bewirken viel.";

            initOptimization();

            uiLayer.innerHTML = `
                <div class="text-frame" style="text-align: center;">
                    <h2>Zwischenauswertung</h2>
                    <p>🌍 Gesamt: <b>${formatNumber(state.gesamt)} L</b><br>
                       🚿 Direkt: <b>${formatNumber(state.direkt)} L</b><br>
                       🛒 Indirekt: <b>${formatNumber(state.indirekt)} L</b></p>
                    <p>Direkter Verbrauch: <b>${formatNumber(anteil)} %</b></p>
                    <p><b>Reflexion:</b> ${reflexion}</p>
                    <button class="action-btn" onclick="goTo('OptStep')">Weiter zum nächsten Abschnitt</button>
                </div>
            `;
            break;

        case 'OptStep':
            setBackground('images/END.png');
            
            if (state.optIndex >= state.optList.length) {
                goTo('END_AUDIO');
                return;
            }

            let optItem = state.optList[state.optIndex];
            let optKey = `${optItem.fId}_${optItem.oId}`;
            let optChoices = DB.optimierungen[optKey] || [];

            let optHtml = '';
            optChoices.forEach(c => {
                let safeText = c.text.replace(/'/g, "\\'");
                optHtml += `<button class="option-btn" onclick="applyOpt('${optItem.fId}', ${c.einsparung}, '${safeText}')">${c.text}</button>`;
            });

            uiLayer.innerHTML = `
                <div class="text-frame">
                    <h3>💧 Optimierung</h3>
                    <p><b>Frage:</b> ${DB.fragen[optItem.fId].frage}</p>
                    <p><b>Deine Antwort:</b> ${DB.fragen[optItem.fId].optionen[optItem.oId].text}</p>
                    <p>Welche dieser Änderungen würdest du im Alltag umsetzen?</p>
                    ${optHtml}
                    <button class="action-btn" style="background:#555; color:white; font-size: 0.8em;" onclick="goTo('END_AUDIO')">Optimierung vorzeitig beenden</button>
                </div>
            `;
            break;
            
        case 'END_AUDIO':
            setBackground('images/Bild0.png');
            uiLayer.innerHTML = `<div class="skip-container"><button class="skip-btn" onclick="goTo('FinalScore')">Überspringen</button></div>`;
            playAudio('audio/END_E.mp3', () => goTo('FinalScore'));
            break;

        case 'FinalScore':
            setBackground('images/END.png');
            
            let optimierungsHtml = "";
            if (state.optimierungen.length > 0) {
                optimierungsHtml += "<ul class='opt-liste'>";
                state.optimierungen.forEach(opt => {
                    optimierungsHtml += `<li><b>${opt.frage}</b><br>-> <i>${opt.text}</i> (Spart: ${formatNumber(opt.einsparung)} L)</li>`;
                });
                optimierungsHtml += "</ul>";
            } else {
                optimierungsHtml = "<p><i>Du hast keine weiteren Optimierungen vorgenommen.</i></p>";
            }

            uiLayer.innerHTML = `
                <div class="text-frame" style="text-align: center;">
                    <h2>📊 Endauswertung</h2>
                    <p><b>Gesamtverbrauch (vorher):</b> ${formatNumber(state.gesamt)} L<br>
                    <b style="color: #69f0ae;">Eingespart:</b> ${formatNumber(state.eingespart)} L</p>
                    
		    <h3>💧 Was bedeutet diese Einsparung?</h3>

			<p>
    			<b>Pro Tag:</b> ${formatNumber(state.eingespart)} Liter<br>
   			Das entspricht dem Trinkwasserbedarf einer Person für
    			<b>${Math.round(state.eingespart / 3)}</b> Tage.
			</p>

			<p>
    			<b>Pro Jahr:</b> ${formatNumber(state.eingespart * 365)} Liter<br>
    			Das entspricht dem Trinkwasserbedarf von Köngen (10.000 Einwohner)
    			für <b>${Math.round((state.eingespart * 365) / (3 * 10000))}</b> Tage.
			</p>

			<p>
   			<b>In 80 Jahren:</b> ${formatNumber(state.eingespart * 365 * 80)} Liter<br>
    			Das entspricht dem Trinkwasserbedarf von Köngen (10.000 Einwohner)
    			für <b>${Math.round((state.eingespart * 365 * 80) / (3 * 10000 * 30))}</b> Monate.
			</p>
                 
                    <hr style="border-color:#444;">
                    
                    <h3>Deine guten Vorsätze:</h3>
                    <div style="text-align: left; background: rgba(0,0,0,0.3); border-radius: 8px; padding: 10px;">
                        ${optimierungsHtml}
                    </div>

                    ${(state.optimierungen.length > 0 && (!KIOSK.aktiv || KIOSK.pdfImKiosk)) ? `<button class="action-btn action-btn-gold" onclick="downloadOptimierungen()">📝 Liste als PDF speichern</button><br>` : ''}
                    
                    <button class="action-btn" onclick="goTo('Start')">Spiel beenden</button>
                </div>
            `;
            break;
    }
}

/* =========================================================
   SPEZIELLE ROUTING LOGIK FÜR AUDIO KETTEN
========================================================= */
function handleAudioNext(currentId, nextTarget) {
    if(nextTarget === 'E02_B') goTo('AudioExpl', {id: 'E02_B', next: 'S03'});
    else if(nextTarget === 'S03') goTo('AudioExpl', {id: 'S03', next: 'F03'});
    else if(nextTarget === 'F03') goTo('Question', {id: 'F03'});
    else if(nextTarget === 'F04') goTo('Question', {id: 'F04'});
}

/* =========================================================
   DATEN VERARBEITUNG
========================================================= */
function saveAnswer(fId, oId) {
    const q = DB.fragen[fId];
    const opt = q.optionen[oId];
    
    if(state.entscheidungen[fId]) {
        let oldVal = state.entscheidungen[fId].verbrauch;
        state.gesamt -= oldVal;
        if(q.typ === 'Direkt') state.direkt -= oldVal; else state.indirekt -= oldVal;
    }

    state.gesamt += opt.verbrauch;
    if(q.typ === 'Direkt') state.direkt += opt.verbrauch; else state.indirekt += opt.verbrauch;
    
    let potential = opt.verbrauch - opt.bestwert;

    state.entscheidungen[fId] = {
        optionId: oId,
        verbrauch: opt.verbrauch,
        potential: potential > 0 ? potential : 0
    };

    updateStats(); 
    goTo('Answer', {id: fId});
}

function initOptimization() {
    state.optList = [];
    state.optIndex = 0;
    state.eingespart = 0;
    state.optimierungen = []; // Leeren, falls man neu startet

    for (let fId in state.entscheidungen) {
        if (state.entscheidungen[fId].potential > 0) {
            state.optList.push({
                fId: fId,
                oId: state.entscheidungen[fId].optionId,
                potential: state.entscheidungen[fId].potential
            });
        }
    }
    state.optList.sort((a, b) => b.potential - a.potential);
}

function applyOpt(fId, val, optText) {
    let numVal = parseFloat(val) || 0;
    state.eingespart += numVal;
    
    // Speichere die Entscheidung im neuen Array (wenn etwas eingespart wurde)
    if (optText !== "Keine Änderung" && numVal > 0) {
        state.optimierungen.push({
            frage: DB.fragen[fId].frage,
            text: optText,
            einsparung: numVal
        });
    }

    updateStats(); 
    state.optIndex++;
    goTo('OptStep');
}

/* =========================================================
   WEB (GitHub Pages / Google Sites)
========================================================= */
function toggleVollbild() {
    const el = document.documentElement;
    if (document.fullscreenElement || document.webkitFullscreenElement) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
    } else {
        const req = el.requestFullscreen || el.webkitRequestFullscreen;
        if (req) Promise.resolve(req.call(el)).catch(() => window.open(location.href, '_blank'));
    }
}

                'FA01', 'FA02', 'FA03', 'FA04', 'FA05', 'FA06', 'FA07', 'FA08'];

// SPIEL STARTEN
window.addEventListener('load', () => {
    if (KIOSK.aktiv) {
        document.getElementById('kiosk-back-btn').classList.add('visible');
    } else {
        document.getElementById('web-btns').classList.add('visible');
        const fsMoeglich = document.fullscreenEnabled || document.webkitFullscreenEnabled;
        if (fsMoeglich) document.getElementById('web-fullscreen-btn').classList.add('visible');
        // Läuft das Spiel eingebettet (z. B. in Google Sites)? Dann "neuer Tab" anbieten
        let eingebettet = true;
        try { eingebettet = window.self !== window.top; } catch (e) {}
        if (eingebettet) document.getElementById('web-newtab-btn').classList.add('visible');
    }
    bilderVorladen();
    goTo('Start');
});
